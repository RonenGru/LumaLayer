<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LumaMeter Installer</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; background: #2b2b2b; padding: 40px; border-radius: 12px; border: 1px solid #444; }
        h1 { color: #3B8ED0; margin-top: 0; }
        p { color: #aaa; margin-bottom: 30px; line-height: 1.5; }
        .warning { background: #332b00; border: 1px solid #665500; color: #ffcc00; padding: 10px; border-radius: 6px; font-size: 0.9em; margin-bottom: 20px; }
        
        esp-web-install-button {
            --esp-tools-button-color: #3B8ED0;
            --esp-tools-button-text-color: #ffffff;
            --esp-tools-button-border-radius: 8px;
            font-size: 1.2em;
        }
    </style>
    <!-- Import ESP Web Tools -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>

    <div class="container">
        <h1>LumaMeter Firmware</h1>
        <p>Connect your ESP32 DevKit V1 via USB to this computer.</p>
        
        <div class="warning">
            ⚠️ <strong>Chrome or Edge Required.</strong><br>
            Make sure no other software (like Cura or Arduino IDE) is using the USB port.
        </div>
        
        <!-- THE MAGIC BUTTON -->
        <esp-web-install-button 
            manifest="manifest.json"
        >
            <button slot="activate">Connect & Install</button>
        </esp-web-install-button>
        
        <p style="margin-top: 40px; font-size: 0.9em; color: #666;">
            After installation, the device will reboot.<br>
            Connect to the "LumaMeter_Setup" WiFi hotspot to configure it.
        </p>
    </div>

</body>
</html>
